<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatSavor 保存到本地库</title>
  <style>
    :root { --cs-bg: #ffffff; --cs-border: #e2e8f0; --cs-text: #0f172a; --cs-text-secondary: #334155; --cs-muted: #64748b; --cs-accent: #4f46e5; --cs-accent-hover: #4338ca; --cs-accent-soft: #eef2ff; --cs-success: #059669; }
    @media (prefers-color-scheme: dark) {
      :root { --cs-bg: #0f172a; --cs-border: #334155; --cs-text: #f1f5f9; --cs-text-secondary: #cbd5e1; --cs-muted: #94a3b8; --cs-accent: #6366f1; --cs-accent-hover: #818cf8; --cs-accent-soft: rgba(99,102,241,0.16); --cs-success: #34d399; }
    }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; background: #f1f5f9; color: var(--cs-text); line-height: 1.7; padding: 20px; }
    @media (prefers-color-scheme: dark) { body { background: #020617; } }
    .auth-card { max-width: 480px; width: 100%; background: var(--cs-bg); border: 1px solid var(--cs-border); border-radius: 16px; padding: 32px; box-shadow: 0 20px 50px rgba(15,23,42,0.10); }
    .auth-icon { width: 44px; height: 44px; border-radius: 12px; background: var(--cs-accent-soft); color: var(--cs-accent); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
    h1 { font-size: 18px; margin: 0 0 6px; }
    .subtitle { font-size: 13px; color: var(--cs-muted); margin: 0 0 20px; }
    .target-box { font-family: "JetBrains Mono", "Fira Code", Consolas, monospace; font-size: 12.5px; background: var(--cs-bg); border: 1px dashed var(--cs-border); border-radius: 8px; padding: 10px 12px; color: var(--cs-text-secondary); margin: 0 0 20px; word-break: break-all; }
    button { padding: 10px 16px; border: none; border-radius: 8px; background: var(--cs-accent); color: #fff; cursor: pointer; margin: 6px 6px 0 0; font-size: 13px; font-weight: 500; transition: all 140ms ease; }
    button:hover { background: var(--cs-accent-hover); }
    button.secondary { background: var(--cs-bg); color: var(--cs-text-secondary); border: 1px solid var(--cs-border); }
    button.secondary:hover { border-color: var(--cs-accent); color: var(--cs-accent); }
    #primary { width: 100%; }
    #status { margin-top: 16px; font-size: 13px; color: var(--cs-success); }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-icon" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 9h18"/></svg>
    </div>
    <h1>ChatSavor 本地知识库直写</h1>
    <p class="subtitle">仅写入您指定的笔记文件夹，授权一次后同浏览器会话内可一键静默保存</p>
    <p id="hint" class="target-box">正在读取待保存内容…</p>
    <button id="primary">📁 选择本地文件夹并保存</button>
    <button id="replace" class="secondary">📁 更换文件夹</button>
    <p id="status"></p>
  </div>
  <script src="../lib/fs-vault.js"></script>
  <script src="writer.js"></script>
</body>
</html>
