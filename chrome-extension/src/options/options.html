<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatSavor 设置</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; max-width: 760px; margin: 32px auto; padding: 0 18px; color: #1f2937; }
    h1 { font-size: 20px; } h2 { font-size: 16px; margin-top: 28px; border-bottom: 1px solid #e5e7eb; padding-bottom: 6px; }
    label { display: block; margin: 10px 0; font-size: 14px; }
    input[type=text], input[type=checkbox], select, textarea { font-size: 14px; }
    input[type=text], select, textarea { padding: 7px 9px; border: 1px solid #d1d5db; border-radius: 6px; }
    textarea { width: 100%; min-height: 130px; font-family: Consolas, monospace; box-sizing: border-box; }
    button { padding: 8px 14px; border: none; border-radius: 6px; background: #667eea; color: #fff; cursor: pointer; font-size: 13px; margin-right: 8px; }
    button.secondary { background: #e5e7eb; color: #374151; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    #status { color: #059669; font-size: 13px; min-height: 20px; }
    .history-item { border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
    .history-item pre { white-space: pre-wrap; word-break: break-word; max-height: 160px; overflow: auto; font-size: 12px; background: #f6f8fa; padding: 8px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>ChatSavor 设置</h1>
  <div id="status" role="status"></div>

  <h2>全局导出偏好</h2>
  <label><input type="checkbox" id="frontmatter"> 默认包含 YAML Frontmatter（Obsidian）</label>
  <label>默认 CoT 思考策略：
    <select id="cotMode"><option value="omit">不包含</option><option value="details">折叠块</option><option value="callout">Obsidian Callout</option></select>
  </label>
  <label>Obsidian Vault 名称：<input type="text" id="vault" placeholder="留空则使用默认库"></label>
  <label>Obsidian 保存目录：<input type="text" id="vaultDir" placeholder="例如 Notes/AI"></label>
  <label>默认弹窗主题：
    <select id="theme"><option value="auto">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select>
  </label>
  <label><input type="checkbox" id="historyEnabled"> 启用本地历史记录（最多 50 条）</label>
  <label>默认 PDF 页脚样式：
    <select id="pdfFooterMode"><option value="none">无页眉页脚（纯净）</option><option value="source">显示来源与时间</option><option value="custom">自定义页脚文字</option></select>
  </label>
  <label>自定义 PDF 页脚文字：<input type="text" id="pdfFooterText" placeholder="输入页脚署名…"></label>
  <label>默认 PDF 水印样式：
    <select id="pdfWatermarkMode"><option value="none">无水印</option><option value="tiled">全页斜向平铺水印</option><option value="corner">右下角标水印</option></select>
  </label>
  <label>默认 PDF 水印文字：<input type="text" id="pdfWatermarkText" value="ChatSavor"></label>
  <button id="save">保存偏好</button>

  <h2>本地历史记录</h2>
  <div class="row"><input type="text" id="historySearch" placeholder="搜索标题 / 平台 / 内容"><button id="clearHistory" class="secondary">清空全部</button></div>
  <div id="historyList"></div>

  <h2>自定义站点规则</h2>
  <p style="font-size:13px;color:#6b7280">JSON 数组，每项：{ "hostPattern": "chat.example.com", "responseSelector": ".answer", "userSelector": ".user", "excludedSelector": "nav" }</p>
  <textarea id="customRules" spellcheck="false">[]</textarea>
  <div class="row"><button id="saveRules">保存规则</button><button id="exportRules" class="secondary">导出 JSON</button><button id="importRules" class="secondary">导入 JSON</button><input type="file" id="importFile" accept="application/json" style="display:none"></div>

  <script src="options.js"></script>
</body>
</html>
