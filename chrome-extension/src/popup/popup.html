<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatSavor</title>
  <style>
    :root {
      --cs-bg: #ffffff; --cs-surface: #f8fafc; --cs-surface-2: #f1f5f9;
      --cs-text: #0f172a; --cs-text-secondary: #334155; --cs-muted: #64748b;
      --cs-border: #e2e8f0; --cs-accent: #4f46e5; --cs-accent-hover: #4338ca;
      --cs-accent-soft: #eef2ff; --cs-success: #10b981; --cs-danger: #ef4444;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --cs-bg: #0f172a; --cs-surface: #1e293b; --cs-surface-2: #020617;
        --cs-text: #f1f5f9; --cs-text-secondary: #cbd5e1; --cs-muted: #94a3b8;
        --cs-border: #334155; --cs-accent: #6366f1; --cs-accent-hover: #818cf8;
        --cs-accent-soft: rgba(99,102,241,0.16); --cs-success: #34d399; --cs-danger: #f87171;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
      background: var(--cs-bg); color: var(--cs-text);
    }
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-bottom: 1px solid var(--cs-border); background: var(--cs-bg);
    }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .brand-icon { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; display: flex; align-items: center; justify-content: center; flex: none; }
    .header h1 { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .version-badge { font-size: 10px; font-weight: 500; color: var(--cs-muted); background: var(--cs-surface); border: 1px solid var(--cs-border); border-radius: 999px; padding: 1px 6px; }
    #open-options { width: 28px; height: 28px; border: none; background: transparent; color: var(--cs-muted); border-radius: 7px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    #open-options:hover { background: var(--cs-surface); color: var(--cs-accent); }
    .content { padding: 14px 16px; }
    .status-card { background: var(--cs-surface); border: 1px solid var(--cs-border); border-radius: 12px; padding: 12px 14px; }
    .status-row { display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cs-muted); flex: none; }
    .status-dot[data-state="ready"] { background: #10b981; box-shadow: 0 0 6px rgba(16,185,129,.6); }
    .status-dot[data-state="idle"] { background: #f59e0b; box-shadow: 0 0 6px rgba(245,158,11,.5); }
    .status-dot[data-state="error"] { background: #ef4444; box-shadow: 0 0 6px rgba(239,68,68,.5); }
    #page-status { font-size: 14px; color: var(--cs-text); font-weight: 600; }
    #page-detail { font-size: 12px; color: var(--cs-muted); word-break: break-word; min-height: 32px; margin-top: 4px; }
    .actions { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; }
    #convert-latest { padding: 11px 14px; font-weight: 600; border-radius: 10px; background: var(--cs-accent); color: #fff; border: none; cursor: pointer; font-size: 13px; }
    #convert-latest:hover { background: var(--cs-accent-hover); }
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .action-grid button { background: var(--cs-bg); border: 1px solid var(--cs-border); color: var(--cs-text); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; font-weight: 500; cursor: pointer; transition: all 140ms ease; }
    .action-grid button:hover { border-color: var(--cs-accent); background: var(--cs-accent-soft); color: var(--cs-accent); }
    .popup-footer { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--cs-border); padding-top: 12px; }
    .hint { font-size: 11px; color: var(--cs-muted); }
    #copy-diagnostics { border: none; background: transparent; color: var(--cs-muted); cursor: pointer; font-size: 11px; padding: 4px 8px; border-radius: 6px; }
    #copy-diagnostics:hover { color: var(--cs-accent); background: var(--cs-accent-soft); }
    button:disabled { opacity: .5; cursor: wait; }
    button:focus-visible { outline: 2px solid var(--cs-accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <span class="brand-icon" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3h10v10H3z"/><path d="M6 6h4v4H6z"/></svg>
      </span>
      <h1>ChatSavor <span id="version" class="version-badge"></span></h1>
    </div>
    <button id="open-options" title="打开设置与本地历史记录" aria-label="设置与历史">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.5"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4"/></svg>
    </button>
  </div>
  <div class="content">
    <div class="status-card">
      <div class="status-row"><span id="status-dot" class="status-dot" data-state="idle"></span><p id="page-status" role="status">正在检查当前网页…</p></div>
      <p id="page-detail"></p>
    </div>
    <div class="actions">
      <button id="convert-latest">转换最新回复</button>
      <div class="action-grid">
        <button id="export-all">导出整场对话</button>
        <button id="multi-select">多选回复导出</button>
        <button id="convert-selection">转换选中内容</button>
        <button id="scan-page">重连并显示按钮</button>
      </div>
    </div>
    <div class="popup-footer">
      <span class="hint">每条 AI 回复末尾会自动出现胶囊按钮</span>
      <button id="copy-diagnostics">复制诊断</button>
    </div>
  </div>
  <script src="../connection.js"></script>
  <script src="controller.js"></script>
</body>
</html>
