<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatSavor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fff;
      color: #333;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 14px 16px;
      text-align: center;
    }
    .header h1 { font-size: 16px; font-weight: 600; }
    .content { padding: 20px 16px; text-align: center; }
    .content p { font-size: 13px; color: #6b7280; line-height: 1.6; }
    .content .icon { font-size: 32px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>ChatSavor</h1>
  </div>
  <div class="content">
    <div class="icon">📥</div>
    <p>Click the <strong>Save</strong> button below any AI reply to preview and download it.</p>
  </div>
</body>
</html>
